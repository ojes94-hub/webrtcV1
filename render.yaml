services:
  - type: web
    name: webrtcv1
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      # Optional room access control. No default or secret is configured.
      # - key: ROOM_ACCESS_SECRET
      #   sync: false
      # - key: DATABASE_URL
      #   sync: false
      # DATABASE_URL_UNPOOLED is only needed when running migrations.
      # - key: DATABASE_URL_UNPOOLED
      #   sync: false
      # Optional abuse-protection tuning.
      # - key: CONFERENCE_TOKEN_RATE_LIMIT
      #   value: 60
      # - key: CONFERENCE_TOKEN_RATE_WINDOW_SECONDS
      #   value: 60
      # - key: ROOM_CREATE_RATE_LIMIT
      #   value: 10
      # - key: ROOM_CREATE_RATE_WINDOW_SECONDS
      #   value: 60
      # - key: ROOM_ACCESS_ATTEMPT_LIMIT
      #   value: 10
      # - key: ROOM_ACCESS_ATTEMPT_WINDOW_SECONDS
      #   value: 900
